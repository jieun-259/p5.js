<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자취방 선택 도우미</title>
  <link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단 60px 헤더: 홈은 왼쪽에 햄버거 버튼과 제목 -->
  <header class="app-header">
    <button type="button" class="menu-btn" onclick="openMenu()" aria-label="메뉴 열기" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="20" y2="17"></line>
      </svg>
    </button>
    <h1 class="header-title">자취방 선택 도우미</h1>
  </header>

  <!-- 햄버거 메뉴 배경 및 280px(모바일) / 240px(1024px 이상 고정) 메뉴 (5개 항목) -->
  <div class="menu-dim" onclick="closeMenu()" aria-hidden="true"></div>
  <aside class="side-menu" aria-label="전체 메뉴">
    <div class="side-menu-head">
      <span class="side-menu-brand">자취방 선택 도우미</span>
      <button type="button" class="menu-close-btn" onclick="closeMenu()" aria-label="메뉴 닫기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"></line>
          <line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="side-menu-nav">
      <a href="index.html" class="side-menu-link is-active">홈</a>
      <a href="register.html" class="side-menu-link">매물 등록</a>
      <a href="checklist.html" class="side-menu-link">현장 체크리스트</a>
      <a href="memo.html" class="side-menu-link">메모와 별점</a>
      <a href="calendar.html" class="side-menu-link">방문 일정</a>
    </nav>
  </aside>

  <main class="main-wrap">
    <div class="container">
      <!-- 요약 영역 3칸 (나중에 JS로 rooms 배열 기반 숫자 계산 후 교체) -->
      <section class="summary-grid" aria-label="매물 현황 요약">
        <div class="summary-cell">
          <span class="summary-label">등록한 매물</span>
          <strong class="summary-value">4</strong>
        </div>
        <div class="summary-cell">
          <span class="summary-label">평가 완료</span>
          <strong class="summary-value">3</strong>
        </div>
        <div class="summary-cell">
          <span class="summary-label">체크 전</span>
          <strong class="summary-value">1</strong>
        </div>
      </section>

      <!-- 다가오는 방문 일정 1건 (나중에 JS로 가장 가까운 visitDate 매물 바인딩) -->
      <a href="calendar.html" class="upcoming-visit">
        <div class="visit-date-box">
          <span class="visit-date-month">11월</span>
          <strong class="visit-date-day">23일</strong>
        </div>
        <div class="visit-info-box">
          <span class="visit-caption">다가오는 방문 일정</span>
          <strong class="visit-room-title">봉천동 청운하우스</strong>
        </div>
      </a>

      <!-- 필터 버튼 + 오른쪽 추천순 표시 -->
      <div class="filter-bar">
        <div class="filter-group" role="group" aria-label="매물 상태 필터">
          <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true" onclick="setRoomFilter('all')">전체</button>
          <button type="button" class="filter-btn" data-filter="done" aria-pressed="false" onclick="setRoomFilter('done')">평가 완료</button>
          <button type="button" class="filter-btn" data-filter="pending" aria-pressed="false" onclick="setRoomFilter('pending')">체크 전</button>
        </div>
        <span class="sort-label">추천순</span>
      </div>

      <!-- 가중치 기준 한 줄 (변경 링크로만 weights.html 진입) -->
      <div class="weight-summary-row">
        <span class="weight-summary-text">가격 40%, 거리 30%, 면적 15%, 집 상태 15%</span>
        <a href="weights.html" class="weight-change-link">변경</a>
      </div>

      <!-- 매물 카드 목록 (renderRoomList()로 필터·순위 기준에 맞게 렌더링) -->
      <section class="room-list" aria-label="등록된 매물 목록">
        <!-- 예시 매물 1 -->
        <a href="register.html?id=1" class="room-card">
          <div class="room-thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A6553" stroke-width="1.6">
              <path d="M3 10.5L12 3l9 7.5"></path>
              <path d="M5 9.5V20h14V9.5"></path>
              <rect x="9.5" y="13" width="5" height="7"></rect>
            </svg>
          </div>
          <div class="room-card-body">
            <div class="room-card-top">
              <span class="rank-badge is-first">1위</span>
              <h2 class="room-name">상도동 햇살빌라</h2>
            </div>
            <p class="room-price">보증금 1,000 / 월세 52</p>
          </div>
          <div class="room-score-box">
            <span class="room-score">92점</span>
          </div>
        </a>

        <!-- 예시 매물 2 -->
        <a href="register.html?id=2" class="room-card">
          <div class="room-thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A6553" stroke-width="1.6">
              <path d="M3 10.5L12 3l9 7.5"></path>
              <path d="M5 9.5V20h14V9.5"></path>
              <rect x="9.5" y="13" width="5" height="7"></rect>
            </svg>
          </div>
          <div class="room-card-body">
            <div class="room-card-top">
              <span class="rank-badge">2위</span>
              <h2 class="room-name">봉천동 청운하우스</h2>
            </div>
            <p class="room-price">보증금 500 / 월세 45</p>
          </div>
          <div class="room-score-box">
            <span class="room-score">84점</span>
          </div>
        </a>

        <!-- 예시 매물 3 -->
        <a href="register.html?id=3" class="room-card">
          <div class="room-thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A6553" stroke-width="1.6">
              <path d="M3 10.5L12 3l9 7.5"></path>
              <path d="M5 9.5V20h14V9.5"></path>
              <rect x="9.5" y="13" width="5" height="7"></rect>
            </svg>
          </div>
          <div class="room-card-body">
            <div class="room-card-top">
              <span class="rank-badge">3위</span>
              <h2 class="room-name">흑석동 그린원룸</h2>
            </div>
            <p class="room-price">보증금 2,000 / 월세 40</p>
          </div>
          <div class="room-score-box">
            <span class="room-score">78점</span>
          </div>
        </a>

        <!-- 예시 매물 4 (체크리스트 전 상태) -->
        <a href="register.html?id=4" class="room-card">
          <div class="room-thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A6553" stroke-width="1.6">
              <path d="M3 10.5L12 3l9 7.5"></path>
              <path d="M5 9.5V20h14V9.5"></path>
              <rect x="9.5" y="13" width="5" height="7"></rect>
            </svg>
          </div>
          <div class="room-card-body">
            <div class="room-card-top">
              <h2 class="room-name">대방동 미소빌</h2>
            </div>
            <p class="room-price">보증금 1,000 / 월세 48</p>
          </div>
          <div class="room-score-box">
            <span class="room-score is-pending">체크 전</span>
          </div>
        </a>
      </section>
    </div>

    <!-- 하단 고정 버튼 영역: 매물 등록 버튼만 배치 -->
    <div class="bottom-bar">
      <a href="register.html" class="btn-primary">매물 등록</a>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    var DEFAULT_SAMPLE_ROOMS = [
      { id: 1, name: '상도동 햇살빌라', deposit: 1000, rent: 52, fee: 5, area: 23, time: 8, visitDate: '2026-11-25', evaluated: true, totalScore: 92 },
      { id: 2, name: '봉천동 청운하우스', deposit: 500, rent: 45, fee: 4, area: 20, time: 12, visitDate: '2026-11-23', evaluated: true, totalScore: 84 },
      { id: 3, name: '흑석동 그린원룸', deposit: 2000, rent: 40, fee: 5, area: 19, time: 15, visitDate: '2026-11-26', evaluated: true, totalScore: 78 },
      { id: 4, name: '대방동 미소빌', deposit: 1000, rent: 48, fee: 5, area: 21, time: 14, visitDate: '2026-11-28', evaluated: false, totalScore: null }
    ];

    var currentRoomFilter = 'all';

    function getHomeRooms() {
      if (typeof loadRooms === 'function') {
        var fromCommon = loadRooms();
        if (Array.isArray(fromCommon)) {
          return fromCommon;
        }
      }
      try {
        var raw = localStorage.getItem('rooms');
        if (raw !== null) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            return parsed;
          }
        }
      } catch (e) {
        // localStorage 파싱 실패 시 기본 예시 목록 사용
      }
      return DEFAULT_SAMPLE_ROOMS;
    }

    function isRoomEvaluated(room) {
      if (!room) {
        return false;
      }
      if (typeof room.evaluated === 'boolean') {
        return room.evaluated;
      }
      if (typeof room.totalScore === 'number') {
        return true;
      }
      var hasStars = room.stars && Object.keys(room.stars).some(function (key) {
        return Number(room.stars[key]) > 0;
      });
      var hasChecks = room.checklist && Object.keys(room.checklist).some(function (key) {
        return Boolean(room.checklist[key]);
      });
      return Boolean(hasStars || hasChecks);
    }

    function formatNumberWithComma(value) {
      var num = Number(value) || 0;
      return num.toLocaleString('ko-KR');
    }

    function createHouseThumb() {
      var thumb = document.createElement('div');
      thumb.className = 'room-thumb';
      thumb.setAttribute('aria-hidden', 'true');

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '28');
      svg.setAttribute('height', '28');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', '#7A6553');
      svg.setAttribute('stroke-width', '1.6');

      var path1 = document.createElementNS(svgNS, 'path');
      path1.setAttribute('d', 'M3 10.5L12 3l9 7.5');
      var path2 = document.createElementNS(svgNS, 'path');
      path2.setAttribute('d', 'M5 9.5V20h14V9.5');
      var rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', '9.5');
      rect.setAttribute('y', '13');
      rect.setAttribute('width', '5');
      rect.setAttribute('height', '7');

      svg.appendChild(path1);
      svg.appendChild(path2);
      svg.appendChild(rect);
      thumb.appendChild(svg);
      return thumb;
    }

    function setRoomFilter(filter) {
      currentRoomFilter = filter;
      var buttons = document.querySelectorAll('.filter-btn[data-filter]');
      buttons.forEach(function (btn) {
        var isMatch = btn.getAttribute('data-filter') === filter;
        btn.classList.toggle('is-active', isMatch);
        btn.setAttribute('aria-pressed', isMatch ? 'true' : 'false');
      });
      renderRoomList();
    }

    function renderRoomList() {
      // localStorage의 매물 목록을 불러와 필터와 순위 기준에 맞춰 .room-list 안에 카드를 렌더링한다.
      var listEl = document.querySelector('.room-list');
      if (!listEl) {
        return;
      }

      var rooms = getHomeRooms();
      var sortedRooms = sortByTotal(rooms);

      var rankMap = {};
      var evalRank = 1;
      sortedRooms.forEach(function (room) {
        if (isRoomEvaluated(room)) {
          rankMap[room.id] = evalRank;
          evalRank += 1;
        }
      });

      var totalCount = rooms.length;
      var doneCount = rooms.filter(isRoomEvaluated).length;
      var pendingCount = totalCount - doneCount;
      var summaryValues = document.querySelectorAll('.summary-value');
      if (summaryValues.length >= 3) {
        summaryValues[0].textContent = String(totalCount);
        summaryValues[1].textContent = String(doneCount);
        summaryValues[2].textContent = String(pendingCount);
      }

      var now = new Date();
      var todayStr = now.getFullYear() + '-' +
        (now.getMonth() + 1 < 10 ? '0' + (now.getMonth() + 1) : String(now.getMonth() + 1)) + '-' +
        (now.getDate() < 10 ? '0' + now.getDate() : String(now.getDate()));
      var datedRooms = rooms.filter(function (r) {
        return r && typeof r.visitDate === 'string' && r.visitDate.trim() !== '';
      }).sort(function (a, b) {
        return a.visitDate.localeCompare(b.visitDate);
      });
      var upcomingRoom = datedRooms.find(function (r) { return r.visitDate >= todayStr; }) || datedRooms[0];
      var monthEl = document.querySelector('.visit-date-month');
      var dayEl = document.querySelector('.visit-date-day');
      var visitTitleEl = document.querySelector('.visit-room-title');
      if (monthEl && dayEl && visitTitleEl) {
        if (upcomingRoom) {
          var dateParts = upcomingRoom.visitDate.split('-');
          monthEl.textContent = parseInt(dateParts[1], 10) + '월';
          dayEl.textContent = parseInt(dateParts[2], 10) + '일';
          visitTitleEl.textContent = upcomingRoom.name || '이름 없는 매물';
        } else {
          monthEl.textContent = '-';
          dayEl.textContent = '없음';
          visitTitleEl.textContent = '예정된 방문 일정이 없어요';
        }
      }

      var filteredRooms = sortedRooms.filter(function (room) {
        var done = isRoomEvaluated(room);
        if (currentRoomFilter === 'done') {
          return done;
        }
        if (currentRoomFilter === 'pending') {
          return !done;
        }
        return true;
      });

      listEl.innerHTML = '';

      if (filteredRooms.length === 0) {
        var emptyEl = document.createElement('p');
        emptyEl.className = 'room-empty-text';
        emptyEl.textContent = currentRoomFilter === 'done'
          ? '평가 완료된 매물이 없어요.'
          : (currentRoomFilter === 'pending' ? '체크 전 매물이 없어요.' : '등록된 매물이 없어요.');
        listEl.appendChild(emptyEl);
        return;
      }

      var fragment = document.createDocumentFragment();
      filteredRooms.forEach(function (room) {
        var done = isRoomEvaluated(room);
        var score = done ? calcTotalScore(room, rooms) : null;
        var rank = rankMap[room.id];

        var card = document.createElement('a');
        card.href = 'register.html?id=' + encodeURIComponent(room.id);
        card.className = 'room-card';

        if (room.photo) {
          var thumb = document.createElement('div');
          thumb.className = 'room-thumb';
          var img = document.createElement('img');
          img.src = room.photo;
          img.alt = room.name || '매물 사진';
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          thumb.appendChild(img);
          card.appendChild(thumb);
        } else {
          card.appendChild(createHouseThumb());
        }

        var body = document.createElement('div');
        body.className = 'room-card-body';

        var topRow = document.createElement('div');
        topRow.className = 'room-card-top';

        if (done && rank) {
          var badge = document.createElement('span');
          badge.className = rank === 1 ? 'rank-badge is-first' : 'rank-badge';
          badge.textContent = rank + '위';
          topRow.appendChild(badge);
        }

        var nameEl = document.createElement('h2');
        nameEl.className = 'room-name';
        nameEl.textContent = room.name || '이름 없는 매물';
        topRow.appendChild(nameEl);

        var priceEl = document.createElement('p');
        priceEl.className = 'room-price';
        priceEl.textContent = '보증금 ' + formatNumberWithComma(room.deposit) + ' / 월세 ' + formatNumberWithComma(room.rent);

        body.appendChild(topRow);
        body.appendChild(priceEl);

        var scoreBox = document.createElement('div');
        scoreBox.className = 'room-score-box';

        var scoreSpan = document.createElement('span');
        if (done && score !== null) {
          scoreSpan.className = 'room-score';
          scoreSpan.textContent = score + '점';
        } else {
          scoreSpan.className = 'room-score is-pending';
          scoreSpan.textContent = '체크 전';
        }
        scoreBox.appendChild(scoreSpan);

        card.appendChild(body);
        card.appendChild(scoreBox);
        fragment.appendChild(card);
      });

      listEl.appendChild(fragment);
    }

    function calcTotalScore(room, rooms) {
      // 가중치(weights)와 전체 매물 비교를 바탕으로 단일 매물(room)의 종합점수를 계산한다.
      if (!room || !isRoomEvaluated(room)) {
        return null;
      }
      if (typeof room.totalScore === 'number') {
        return Math.round(room.totalScore);
      }

      var weights = { price: 8, dist: 6, area: 3, env: 3 };
      try {
        var rawWeights = localStorage.getItem('weights');
        if (rawWeights) {
          var parsedWeights = JSON.parse(rawWeights);
          if (parsedWeights && typeof parsedWeights === 'object') {
            weights = parsedWeights;
          }
        }
      } catch (e) {
        // 기본 가중치 사용
      }

      var sumW = (Number(weights.price) || 0) + (Number(weights.dist) || 0) + (Number(weights.area) || 0) + (Number(weights.env) || 0);
      if (sumW <= 0) {
        sumW = 1;
      }

      var list = Array.isArray(rooms) && rooms.length ? rooms : [room];
      var costs = list.map(function (r) { return (Number(r.rent) || 0) + (Number(r.fee) || 0); });
      var times = list.map(function (r) { return Number(r.time) || 0; });
      var areas = list.map(function (r) { return Number(r.area) || 0; });

      var minCost = Math.min.apply(null, costs);
      var maxCost = Math.max.apply(null, costs);
      var minTime = Math.min.apply(null, times);
      var maxTime = Math.max.apply(null, times);
      var minArea = Math.min.apply(null, areas);
      var maxArea = Math.max.apply(null, areas);

      var myCost = (Number(room.rent) || 0) + (Number(room.fee) || 0);
      var myTime = Number(room.time) || 0;
      var myArea = Number(room.area) || 0;

      var priceScore = maxCost === minCost ? 100 : 100 - ((myCost - minCost) / (maxCost - minCost)) * 40;
      var distScore = maxTime === minTime ? 100 : 100 - ((myTime - minTime) / (maxTime - minTime)) * 40;
      var areaScore = maxArea === minArea ? 100 : 60 + ((myArea - minArea) / (maxArea - minArea)) * 40;

      var starAvg = 3.5;
      if (room.stars) {
        var vals = Object.keys(room.stars).map(function (k) { return Number(room.stars[k]) || 0; }).filter(function (v) { return v > 0; });
        if (vals.length) {
          starAvg = vals.reduce(function (acc, cur) { return acc + cur; }, 0) / vals.length;
        }
      }
      var envScore = (starAvg / 5) * 100;

      var total = (
        priceScore * (Number(weights.price) || 0) +
        distScore * (Number(weights.dist) || 0) +
        areaScore * (Number(weights.area) || 0) +
        envScore * (Number(weights.env) || 0)
      ) / sumW;

      return Math.round(total);
    }

    function sortByTotal(rooms) {
      // calcTotalScore 결과를 기준으로 매물 배열(rooms)을 추천순 내림차순 정렬한다.
      if (!Array.isArray(rooms)) {
        return [];
      }
      return rooms.slice().sort(function (a, b) {
        var aDone = isRoomEvaluated(a);
        var bDone = isRoomEvaluated(b);
        if (aDone !== bDone) {
          return aDone ? -1 : 1;
        }
        var aScore = calcTotalScore(a, rooms) || 0;
        var bScore = calcTotalScore(b, rooms) || 0;
        return bScore - aScore;
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderRoomList();
    });
  </script>
</body>
</html>
