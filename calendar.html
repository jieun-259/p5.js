<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방문 일정 · 자취방 선택 도우미</title>
  <link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="back-btn" aria-label="뒤로 가기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </a>
    <h1 class="header-title">방문 일정</h1>
  </header>

  <div class="menu-dim" onclick="closeMenu()" aria-hidden="true"></div>
  <aside class="side-menu" aria-label="전체 메뉴">
    <div class="side-menu-head">
      <span class="side-menu-brand">자취방 선택 도우미</span>
      <button type="button" class="menu-close-btn" onclick="closeMenu()" aria-label="메뉴 닫기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"></line>
          <line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="side-menu-nav">
      <a href="index.html" class="side-menu-link">홈</a>
      <a href="register.html" class="side-menu-link">매물 등록</a>
      <a href="checklist.html" class="side-menu-link">현장 체크리스트</a>
      <a href="memo.html" class="side-menu-link">메모와 별점</a>
      <a href="calendar.html" class="side-menu-link is-active">방문 일정</a>
    </nav>
  </aside>

  <main class="main-wrap">
    <div class="container">
      <!-- 모바일: 위 달력 / 아래 목록, 1024px 이상: 왼쪽 달력 / 오른쪽 300px 목록 -->
      <div class="calendar-layout">
        <!-- 조회 전용 달력 (.calendar-wrap) - 일정 추가 버튼 없음 -->
        <section class="calendar-wrap" aria-label="월간 방문 일정 달력">
          <div class="calendar-nav">
            <button type="button" class="calendar-nav-btn" onclick="moveMonth(-1)">이전 달</button>
            <h2 class="calendar-month-title">2026년 11월</h2>
            <button type="button" class="calendar-nav-btn" onclick="moveMonth(1)">다음 달</button>
          </div>

          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>
          </div>

          <!-- JS 연동 영역: 오늘(today), 방문일(has-visit), 선택일(is-selected) 클래스로 상태 표시 -->
          <div class="calendar-days">
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-01')"><span class="calendar-day-num">1</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-02')"><span class="calendar-day-num">2</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-03')"><span class="calendar-day-num">3</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-04')"><span class="calendar-day-num">4</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-05')"><span class="calendar-day-num">5</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-06')"><span class="calendar-day-num">6</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-07')"><span class="calendar-day-num">7</span><span class="calendar-dot"></span></button>

            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-08')"><span class="calendar-day-num">8</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-09')"><span class="calendar-day-num">9</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-10')"><span class="calendar-day-num">10</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-11')"><span class="calendar-day-num">11</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-12')"><span class="calendar-day-num">12</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-13')"><span class="calendar-day-num">13</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-14')"><span class="calendar-day-num">14</span><span class="calendar-dot"></span></button>

            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-15')"><span class="calendar-day-num">15</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-16')"><span class="calendar-day-num">16</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-17')"><span class="calendar-day-num">17</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-18')"><span class="calendar-day-num">18</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-19')"><span class="calendar-day-num">19</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-20')"><span class="calendar-day-num">20</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-21')"><span class="calendar-day-num">21</span><span class="calendar-dot"></span></button>

            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-22')"><span class="calendar-day-num">22</span><span class="calendar-dot"></span></button>
            <!-- 오늘(2026-11-23) + 방문일(봉천동 청운하우스): 연한 테두리 원 + 주황 글자/점 -->
            <button type="button" class="calendar-day-btn today has-visit" onclick="showRoomByDate('2026-11-23')"><span class="calendar-day-num">23</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-24')"><span class="calendar-day-num">24</span><span class="calendar-dot"></span></button>
            <!-- 선택된 방문일(상도동 햇살빌라): 주황 원 + 흰 글자 -->
            <button type="button" class="calendar-day-btn has-visit is-selected" onclick="showRoomByDate('2026-11-25')"><span class="calendar-day-num">25</span><span class="calendar-dot"></span></button>
            <!-- 방문일(흑석동 그린원룸): 주황 글자/점 -->
            <button type="button" class="calendar-day-btn has-visit" onclick="showRoomByDate('2026-11-26')"><span class="calendar-day-num">26</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-27')"><span class="calendar-day-num">27</span><span class="calendar-dot"></span></button>
            <!-- 방문일(대방동 미소빌): 주황 글자/점 -->
            <button type="button" class="calendar-day-btn has-visit" onclick="showRoomByDate('2026-11-28')"><span class="calendar-day-num">28</span><span class="calendar-dot"></span></button>

            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-29')"><span class="calendar-day-num">29</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn" onclick="showRoomByDate('2026-11-30')"><span class="calendar-day-num">30</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn is-outside" disabled><span class="calendar-day-num">1</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn is-outside" disabled><span class="calendar-day-num">2</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn is-outside" disabled><span class="calendar-day-num">3</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn is-outside" disabled><span class="calendar-day-num">4</span><span class="calendar-dot"></span></button>
            <button type="button" class="calendar-day-btn is-outside" disabled><span class="calendar-day-num">5</span><span class="calendar-dot"></span></button>
          </div>
        </section>

        <!-- 월별 방문 일정 목록 (JS renderVisitList(year, month)로 날짜순 렌더링) -->
        <section class="visit-list-panel" aria-label="이번 달 방문 일정 목록">
          <h2 class="visit-list-heading">11월 방문 일정 4건</h2>
          <div class="visit-list-items">
            <a href="register.html?id=2" class="visit-list-item">
              <div class="visit-list-date-row">
                <span class="visit-list-date is-upcoming">11월 23일 (월)</span>
                <span class="visit-today-tag">오늘</span>
              </div>
              <h3 class="visit-list-name">봉천동 청운하우스</h3>
              <p class="visit-list-address">서울 관악구 청룡길 45</p>
            </a>

            <a href="register.html?id=1" class="visit-list-item is-selected">
              <div class="visit-list-date-row">
                <span class="visit-list-date is-upcoming">11월 25일 (수)</span>
              </div>
              <h3 class="visit-list-name">상도동 햇살빌라</h3>
              <p class="visit-list-address">서울 동작구 상도로 123</p>
            </a>

            <a href="register.html?id=3" class="visit-list-item">
              <div class="visit-list-date-row">
                <span class="visit-list-date is-upcoming">11월 26일 (목)</span>
              </div>
              <h3 class="visit-list-name">흑석동 그린원룸</h3>
              <p class="visit-list-address">서울 동작구 흑석로 77</p>
            </a>

            <a href="register.html?id=4" class="visit-list-item">
              <div class="visit-list-date-row">
                <span class="visit-list-date is-upcoming">11월 28일 (토)</span>
              </div>
              <h3 class="visit-list-name">대방동 미소빌</h3>
              <p class="visit-list-address">서울 영등포구 여의대방로 12</p>
            </a>
          </div>
          <!-- 해당 월에 일정이 없을 때 JS에서 표시할 문구 예시:
          <p class="calendar-empty-text">이번 달 방문 일정이 없어요.</p>
          -->
        </section>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
